# Builds the deck and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Source: GitHub Actions. No secrets.
# Details and other hosting options: references/hosting.md in the skill.
name: Deploy deck to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if Pages isn't enabled yet: Settings -> Pages -> Source: GitHub Actions
      - id: pages
        uses: actions/configure-pages@v6.0.0

      - run: npm ci

      # base_path is "" for a root site (custom domain, <owner>.github.io repo) and "/<repo>"
      # for a project site; Slidev needs it with a trailing slash, or the assets 404.
      # Anyone can read the speaker notes at /#/presenter/1. To leave them out, add --without-notes.
      - name: Build deck
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx slidev build slides.md --base "${BASE_PATH%/}/"

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
