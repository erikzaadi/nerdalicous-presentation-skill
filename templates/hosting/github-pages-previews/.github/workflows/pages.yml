# Publishes the deck to GitHub Pages: main at the site root, each open PR at pr-<n>/.
# The gh-pages branch stores the assembled site; actions/deploy-pages publishes it.
# One-time setup, details and caveats: "GitHub Pages with PR previews" in the skill's
# references/hosting.md. In short: Settings -> Pages -> Source: GitHub Actions, and
# Settings -> Environments -> github-pages -> Deployment branches: no restriction.
name: Deploy deck to GitHub Pages (with PR previews)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  build:
    # main (push or a manual run on it), and PRs from this repo; forks are skipped, not failed
    if: >-
      (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    # A newer push to the same PR (or main) cancels this build
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      target: ${{ steps.target.outputs.target }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if Pages isn't enabled yet: Settings -> Pages -> Source: GitHub Actions
      - id: pages
        uses: actions/configure-pages@v6.0.0

      - run: npm ci

      # target: where the build lands in the site ("." for main, "pr-<n>" for a PR)
      # sha: the commit it was built from, so publish can skip a build that's been superseded
      - id: target
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PR: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="${BASE_PATH%/}/"
          if [ -n "$PR" ]; then
            target="pr-$PR" sha="$PR_SHA" base="${base}pr-$PR/"
          else
            target=. sha="$GITHUB_SHA"
          fi
          { echo "target=$target"; echo "sha=$sha"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

      # Anyone can read the speaker notes at /#/presenter/1. To leave them out, add --without-notes.
      - name: Build deck
        env:
          DECK_BASE: ${{ steps.target.outputs.base }}
        run: npx slidev build slides.md --base "$DECK_BASE"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: deck
          path: dist
          retention-days: 1

  publish:
    needs: build
    # Runs on a PR close even though build is skipped then; otherwise only after a good build
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      ((github.event_name == 'pull_request' && github.event.action == 'closed') || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    # Every change to the site goes through here, one at a time and none dropped:
    # queue: max keeps every pending run (the default queue keeps only the newest)
    concurrency:
      group: pages-publish
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The script comes from the default branch, never from the PR, since this job can write
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/pages-tree.mjs
            .nvmrc
          sparse-checkout-cone-mode: false

      # The deck's Node, not whatever the runner image defaults to
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - id: pages
        uses: actions/configure-pages@v6.0.0

      # Builds can finish out of order, and a PR can close or reopen while one waits here.
      # Only act when this run still describes the current state.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          act=true
          if [ "$EVENT" != pull_request ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
            [ "$head" = "$BUILT_SHA" ] || { act=false; echo "::notice::$DEFAULT_BRANCH moved on to $head; a newer run publishes it."; }
          else
            info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')
            read -r state head <<< "$info"
            if [ "$ACTION" = closed ]; then
              [ "$state" != OPEN ] || { act=false; echo "::notice::PR #$PR was reopened; keeping its preview."; }
            elif [ "$state" != OPEN ]; then
              act=false; echo "::notice::PR #$PR closed while this build waited; not publishing it."
            elif [ "$head" != "$BUILT_SHA" ]; then
              act=false; echo "::notice::PR #$PR moved on to $head; a newer run publishes it."
            fi
          fi
          echo "act=$act" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.act == 'true' && github.event.action != 'closed'
        uses: actions/download-artifact@v8.0.2
        with:
          name: deck
          path: ${{ runner.temp }}/deck

      - id: tree
        if: steps.check.outputs.act == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          TARGET: ${{ needs.build.outputs.target }}
        run: |
          if [ "$ACTION" = closed ]; then
            node scripts/pages-tree.mjs remove "$PR"
          else
            node scripts/pages-tree.mjs deploy "$TARGET" "$RUNNER_TEMP/deck"
          fi

      - if: steps.check.outputs.act == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ steps.tree.outputs.dir }}

      - id: deployment
        if: steps.check.outputs.act == 'true'
        uses: actions/deploy-pages@v5.0.1

      # One comment per PR, found by its marker and updated in place
      - if: steps.check.outputs.act == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          CLOSED: ${{ github.event.action == 'closed' }}
        with:
          script: |
            const marker = '<!-- deck-preview -->'
            const pr = context.issue.number
            const base = process.env.BASE_URL.replace(/\/*$/, '/')
            const body = process.env.CLOSED === 'true'
              ? [marker, '## Deck preview', '', `The preview for this PR was removed. \`main\`: ${base}`].join('\n')
              : [
                  marker,
                  '## Deck preview',
                  '',
                  '| | URL |',
                  '|---|---|',
                  `| **This PR** | ${base}pr-${pr}/ |`,
                  `| **\`main\`** | ${base} |`,
                  '',
                  'Updates on every push to this PR. Removed when the PR closes.',
                ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else if (process.env.CLOSED !== 'true') {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body })
            }

      - name: Write job summary
        if: steps.check.outputs.act == 'true'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          TARGET: ${{ needs.build.outputs.target }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base="${BASE_URL%/}/"
          {
            echo "## Deck"
            if [ "$ACTION" = closed ]; then
              echo "- Removed the preview for PR #$PR"
            elif [ "$TARGET" = . ]; then
              echo "- **main:** $base"
            else
              echo "- **This PR:** ${base}${TARGET}/"
              echo "- **main:** $base"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
